name: Publicar Explorador

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos estáticos
        run: |
          mkdir public
          cp index.html app.js style.css .nojekyll public/
          cp -R vendor terrain public/
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
